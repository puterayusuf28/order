<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard — Putra Yusuf Laundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7FD;
  --surface:#FFFFFF;
  --ink:#0B2545;
  --muted:#66779B;
  --line:#DCE6F5;
  --blue:#2E6BFF;
  --blue-dark:#173C97;
  --blue-soft:#E7EFFF;
  --teal:#0EA5A0;
  --teal-soft:#DFF7F5;
  --purple:#7C5CFC;
  --purple-soft:#EEE9FF;
  --green:#17A673;
  --green-soft:#DFF6EB;
  --red:#D6453D;
  --red-soft:#FBE7E6;
  --shadow: 0 10px 30px -12px rgba(23,60,151,0.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:40px;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

header.topbar{
  background:linear-gradient(180deg,var(--blue) 0%, var(--blue-dark) 100%);
  color:#fff;
  padding:16px 16px 40px;
  border-radius:0 0 28px 28px;
  box-shadow:var(--shadow);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand img{width:38px; height:38px; border-radius:50%; box-shadow:0 2px 6px rgba(11,37,69,.25); flex:none;}
.brand-text h1{font-family:'Baloo 2',sans-serif; font-size:18px; font-weight:700; margin:0; line-height:1.15;}
.brand-text p{margin:1px 0 0; font-size:11.5px; opacity:.82; font-weight:500;}
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.15s ease; flex:none;
}
.icon-btn:active{transform:scale(.92); background:rgba(255,255,255,.24);}
.icon-btn svg{width:18px; height:18px;}
.header-actions{display:flex; gap:8px;}

main{max-width:720px; margin:0 auto; padding:0 16px;}

/* ---------- Stat cards ---------- */
.stat-grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
  margin-top:-24px; margin-bottom:20px;
}
@media (min-width:560px){ .stat-grid{ grid-template-columns:repeat(4,1fr); } }
.stat-card{
  background:var(--surface); border-radius:16px; padding:14px 16px;
  box-shadow:var(--shadow); border:1px solid var(--line);
}
.stat-card .lbl{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
.stat-card .val{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px; color:var(--blue-dark); margin-top:4px;}
.stat-card.accent-teal .val{color:var(--teal);}
.stat-card.accent-purple .val{color:var(--purple);}
.stat-card.accent-green .val{color:var(--green);}

/* ---------- Section card ---------- */
.card{
  background:var(--surface); border-radius:18px; padding:18px; margin-bottom:18px;
  box-shadow:0 6px 18px -10px rgba(23,60,151,.2); border:1px solid var(--line);
}
.card h2{font-family:'Baloo 2',sans-serif; font-size:15.5px; margin:0 0 14px; color:var(--blue-dark);}

/* ---------- Status chips ---------- */
.status-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.status-chip{border-radius:12px; padding:10px 8px; text-align:center;}
.status-chip .num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px;}
.status-chip .lbl{font-size:10px; font-weight:600; margin-top:2px;}
.status-chip.terima{background:var(--blue-soft); color:var(--blue);}
.status-chip.terima-lunas{background:var(--purple-soft); color:var(--purple);}
.status-chip.selesai-lunas{background:var(--teal-soft); color:var(--teal);}
.status-chip.diambil{background:var(--green-soft); color:var(--green);}

/* ---------- Chart ---------- */
.chart-wrap{overflow-x:auto; padding-bottom:4px;}
.chart-svg{display:block;}
.chart-bar{fill:var(--blue); transition:fill .15s ease;}
.chart-bar:hover{fill:var(--blue-dark);}
.chart-axis-label{font-family:'Plus Jakarta Sans',sans-serif; font-size:9px; fill:var(--muted);}
.chart-value-label{font-family:'IBM Plex Mono',monospace; font-size:8.5px; fill:var(--blue-dark); font-weight:600;}

/* ---------- Top customers ---------- */
.cust-row{
  display:flex; align-items:center; gap:12px; padding:10px 0;
  border-bottom:1px solid var(--line);
}
.cust-row:last-child{border-bottom:none;}
.cust-rank{
  width:26px; height:26px; border-radius:50%; background:var(--blue-soft); color:var(--blue-dark);
  display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
  font-weight:700; font-size:12px; flex:none;
}
.cust-rank.top1{background:linear-gradient(135deg,#FFD873,#FFB13B); color:#7A4B00;}
.cust-rank.top2{background:linear-gradient(135deg,#D7E3F5,#B9CDF3); color:#173C97;}
.cust-rank.top3{background:linear-gradient(135deg,#F3C9A6,#E3A374); color:#7A3E00;}
.cust-info{flex:1; min-width:0;}
.cust-name{font-weight:700; font-size:14px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cust-meta{font-size:11px; color:var(--muted);}
.cust-spend{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; color:var(--blue-dark); text-align:right; flex:none;}

/* ---------- States ---------- */
.state-box{
  text-align:center; padding:50px 24px; color:var(--muted);
}
.state-box svg{width:48px; height:48px; margin:0 auto 14px; opacity:.5;}
.state-box h3{font-family:'Baloo 2',sans-serif; color:var(--blue-dark); margin:0 0 6px; font-size:16px;}
.state-box p{margin:0 0 16px; font-size:13px; line-height:1.5;}
.spinner{
  width:28px; height:28px; border-radius:50%; border:3px solid var(--blue-soft); border-top-color:var(--blue);
  margin:0 auto 14px; animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.btn-primary{
  background:linear-gradient(135deg,var(--blue),var(--blue-dark)); color:#fff; border:none;
  border-radius:13px; padding:12px 22px; font-size:14px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  box-shadow:0 8px 16px -8px rgba(23,60,151,.5);
}
.btn-primary:active{transform:scale(.98);}
.btn-primary svg{width:16px; height:16px;}

.updated-note{text-align:center; font-size:11px; color:var(--muted); margin:-6px 0 18px;}

/* ---------- Settings sheet ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(11,37,69,.45); backdrop-filter:blur(1px);
  z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51;
  background:var(--surface); border-radius:24px 24px 0 0;
  max-height:80vh; overflow-y:auto;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -12px 30px rgba(11,37,69,.2);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 0;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 6px;}
.sheet-head h2{font-family:'Baloo 2',sans-serif; font-size:17px; margin:0; color:var(--blue-dark);}
.sheet-close{background:var(--blue-soft); color:var(--blue); border:none; width:30px; height:30px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.sheet-body{padding:6px 18px 24px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px;}
.field input{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 13px;
  font-family:inherit; font-size:14.5px; color:var(--ink); background:#FAFCFF; outline:none;
}
.field input:focus{border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px var(--blue-soft);}
.settings-note{font-size:12px; color:var(--muted); line-height:1.5; background:var(--blue-soft); padding:12px 14px; border-radius:12px; margin-bottom:16px;}

#toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s ease; z-index:60;
  box-shadow:0 10px 24px rgba(0,0,0,.25); max-width:88vw;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.err{background:#B4231F;}

/* ---------- Period picker ---------- */
.period-bar{
  background:var(--surface); border-radius:16px; padding:12px 14px;
  margin:-22px 0 16px; box-shadow:var(--shadow); border:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
}
.preset-group{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
.preset-btn{
  padding:7px 14px; border-radius:10px; border:1.5px solid var(--line); background:#FAFCFF;
  color:var(--muted); font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:12px;
  cursor:pointer; transition:.15s ease; white-space:nowrap;
}
.preset-btn.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
.preset-btn:active{ transform:scale(.95); }
.custom-wrap{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.custom-wrap input[type=date]{
  border:1.5px solid var(--line); border-radius:10px; padding:7px 10px;
  font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:500; color:var(--ink);
  background:#FAFCFF; outline:none; max-width:130px;
}
.custom-wrap input[type=date]:focus{ border-color:var(--blue); background:#fff; }
.custom-apply{
  padding:7px 14px; border-radius:10px; background:var(--blue-soft); color:var(--blue);
  border:none; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:12px; cursor:pointer;
}
.custom-apply:active{ background:var(--blue); color:#fff; }
.period-label{
  font-size:12px; color:var(--muted); font-weight:600; text-align:right; padding-top:2px; white-space:nowrap;
}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <img id="brand-logo" alt="Logo">
      <div class="brand-text">
        <h1>Dashboard Owner</h1>
        <p>Putra Yusuf Laundry</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-back" title="Kembali ke App Kasir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon-btn" id="btn-refresh" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Pengaturan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.04 1.56V21a2 2 0 01-4 0v-.09A1.7 1.7 0 008.5 19.36a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.56-1.04H2a2 2 0 010-4h.09A1.7 1.7 0 003.64 8.5a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H8a1.7 1.7 0 001.04-1.56V2a2 2 0 014 0v.09a1.7 1.7 0 001.04 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V8a1.7 1.7 0 001.56 1.04H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.56 1.04z"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="period-bar" id="period-bar">
    <div class="preset-group">
      <button class="preset-btn active" data-preset="today">Hari Ini</button>
      <button class="preset-btn" data-preset="week">7 Hari</button>
      <button class="preset-btn" data-preset="month">30 Hari</button>
      <button class="preset-btn" data-preset="thismonth">Bulan Ini</button>
      <button class="preset-btn" data-preset="custom">Custom</button>
    </div>
    <div class="custom-wrap" id="custom-wrap" style="display:none;">
      <input type="date" id="f-from" title="Dari tanggal">
      <span style="color:var(--muted); font-size:12px;">–</span>
      <input type="date" id="f-to" title="Sampai tanggal">
      <button class="custom-apply" id="btn-apply-custom">Tampilkan</button>
    </div>
  </div>
  <div class="period-label" id="period-label"></div>

  <div id="content"></div>
</main>

<!-- SETTINGS SHEET -->
<div class="overlay" id="overlay-settings"></div>
<div class="sheet" id="settings-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Pengaturan</h2>
    <button class="sheet-close" id="close-settings-sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="settings-note">URL ini sama dengan yang dipakai di app kasir. Kalau kamu buka dashboard ini dari HP/browser yang sama dengan app kasir, biasanya udah otomatis kesimpan.</div>
    <div class="field">
      <label>Apps Script Web App URL</label>
      <input type="url" id="f-script-url" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <button class="btn-primary" id="btn-save-settings" style="width:100%;">Simpan &amp; Muat Data</button>
  </div>
</div>

<div id="toast"></div>

  const LS_SCRIPT_URL = "py_laundry_script_url";

  function rupiah(n){ return "Rp" + Math.round(n||0).toLocaleString("id-ID"); }
  function rupiahShort(n){
    n = n || 0;
    if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "jt";
    if(n >= 1000) return Math.round(n/1000) + "rb";
    return String(n);
  }
  function toast(msg, isErr){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = isErr ? "err show" : "show";
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  document.getElementById("brand-logo").src = LOGO_URI;

  /* ---------------- Settings sheet ---------------- */
  const overlayS = document.getElementById("overlay-settings");
  const sheetS = document.getElementById("settings-sheet");
  function openSettings(){
    document.getElementById("f-script-url").value = localStorage.getItem(LS_SCRIPT_URL) || "";
    overlayS.classList.add("show"); sheetS.classList.add("show");
  }
  function closeSettings(){ overlayS.classList.remove("show"); sheetS.classList.remove("show"); }
  document.getElementById("btn-settings").addEventListener("click", openSettings);
  document.getElementById("close-settings-sheet").addEventListener("click", closeSettings);
  overlayS.addEventListener("click", closeSettings);
  document.getElementById("btn-save-settings").addEventListener("click", ()=>{
    const url = document.getElementById("f-script-url").value.trim();
    if(!url){ toast("Isi URL dulu ya", true); return; }
    localStorage.setItem(LS_SCRIPT_URL, url);
    closeSettings();
    loadSummary();
  });

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <h3>Belum tersambung</h3>
        <p>Isi dulu Apps Script Web App URL di Pengaturan buat mulai lihat data.</p>
      </div>`;
    content.querySelector(".state-box").insertAdjacentHTML("beforeend",
      '<div style="text-align:center;"><button class="btn-primary" id="btn-setup-open">Buka Pengaturan</button></div>');
    document.getElementById("btn-setup-open").addEventListener("click", openSettings);
  }

  function renderLoading(){
    content.innerHTML = `<div class="state-box"><div class="spinner"></div><h3>Memuat data...</h3><p>Mengambil rangkuman dari Google Sheets</p></div>`;
  }

  function renderError(msg){
    content.innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <h3>Gagal memuat data</h3>
        <p>${escapeHtml(msg)}</p>
      </div>`;
    content.querySelector(".state-box").insertAdjacentHTML("beforeend",
      '<div style="text-align:center;"><button class="btn-primary" id="btn-retry">Coba Lagi</button></div>');
    document.getElementById("btn-retry").addEventListener("click", loadSummary);
  }

  /* ---------------- Period picker ---------------- */
  function todayLocal(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function addDays(dateStr, n){
    const d = new Date(dateStr+"T12:00:00");
    d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDateID(iso){
    const [y,m,day] = iso.split("-");
    const months=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agt","Sep","Okt","Nov","Des"];
    return parseInt(day)+" "+months[parseInt(m)-1]+" "+y;
  }

  let currentFrom = todayLocal();
  let currentTo   = todayLocal();

  function getPresetRange(preset){
    const today = todayLocal();
    if(preset==="today")     return {from:today, to:today};
    if(preset==="week")      return {from:addDays(today,-6), to:today};
    if(preset==="month")     return {from:addDays(today,-29), to:today};
    if(preset==="thismonth"){
      const d=new Date(); const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0");
      return {from:y+"-"+m+"-01", to:today};
    }
    return null; // custom
  }

  function updatePeriodLabel(from, to){
    const el = document.getElementById("period-label");
    if(!el) return;
    el.textContent = from===to ? fmtDateID(from) : fmtDateID(from)+" — "+fmtDateID(to);
  }

  document.querySelectorAll(".preset-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".preset-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const preset = btn.dataset.preset;
      const cw = document.getElementById("custom-wrap");
      if(preset==="custom"){
        cw.style.display="flex";
        const today=todayLocal();
        document.getElementById("f-from").value = currentFrom;
        document.getElementById("f-to").value   = currentTo;
      } else {
        cw.style.display="none";
        const r=getPresetRange(preset);
        currentFrom=r.from; currentTo=r.to;
        updatePeriodLabel(currentFrom,currentTo);
        loadSummary();
      }
    });
  });

  document.getElementById("btn-apply-custom").addEventListener("click", ()=>{
    const from = document.getElementById("f-from").value;
    const to   = document.getElementById("f-to").value;
    if(!from || !to){ toast("Isi dulu tanggal dari dan sampai ya", true); return; }
    if(from>to){ toast("Tanggal 'dari' harus sebelum 'sampai'", true); return; }
    currentFrom=from; currentTo=to;
    updatePeriodLabel(currentFrom,currentTo);
    loadSummary();
  });

  /* ---------------- Chart (grouping otomatis kalau range panjang) ---------------- */
  function buildChart(dailyRevenue){
    // Kalau data >60 hari, grup per minggu supaya bar gak terlalu banyak & tetap kebaca
    let data = dailyRevenue;
    if(dailyRevenue.length > 60){
      const weekMap = {};
      dailyRevenue.forEach(d=>{
        const dt=new Date(d.date+"T12:00:00"), day=dt.getDay();
        const monday=new Date(dt); monday.setDate(dt.getDate()-(day===0?6:day-1));
        const wk=monday.toISOString().slice(0,10);
        weekMap[wk]=(weekMap[wk]||0)+d.total;
      });
      data=Object.keys(weekMap).sort().map(k=>({date:k,total:weekMap[k]}));
    }

    const MIN_W = 320;
    const barCount = data.length;
    const w = Math.max(MIN_W, barCount * (barCount > 30 ? 16 : 22));
    const h = 140;
    const padBottom = 20;
    const maxVal = Math.max(1, ...data.map(d=>d.total));
    const barW = (w/barCount)*0.62;
    const gap  = (w/barCount);
    const labelEvery = Math.ceil(barCount/8);

    let bars="";
    data.forEach((d,i)=>{
      const barH = Math.max(2,(d.total/maxVal)*(h-padBottom-14));
      const x=(i*gap+(gap-barW)/2).toFixed(1);
      const y=(h-padBottom-barH).toFixed(1);
      const showLbl = (i%labelEvery===0)||(i===barCount-1);
      const lbl = data.length>60 ? d.date.slice(5,10) : d.date.slice(8,10)+"/"+d.date.slice(5,7);
      bars+=`<rect class="chart-bar" x="${x}" y="${y}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3"><title>${d.date}: ${rupiah(d.total)}</title></rect>`;
      if(showLbl) bars+=`<text class="chart-axis-label" x="${(parseFloat(x)+barW/2).toFixed(1)}" y="${h-4}" text-anchor="middle">${lbl}</text>`;
    });
    return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${bars}</svg></div>`;
  }

  /* ---------------- Render dashboard (period-aware) ---------------- */
  function renderDashboard(data){
    const sc = data.statusCounts || {};
    const topCustomers = data.topCustomers || [];
    const rankClass = i=> i===0?"top1":i===1?"top2":i===2?"top3":"";
    const periodTxt = data.dateFrom===data.dateTo
      ? fmtDateID(data.dateFrom)
      : fmtDateID(data.dateFrom)+" — "+fmtDateID(data.dateTo);

    content.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card" style="grid-column:span 2">
          <div class="lbl">Total Omzet Periode Ini</div>
          <div class="val" style="font-size:22px;">${rupiah(data.totalRevenue)}</div>
        </div>
        <div class="stat-card accent-teal">
          <div class="lbl">Total Order</div>
          <div class="val">${(data.totalOrders||0).toLocaleString("id-ID")}</div>
        </div>
        <div class="stat-card accent-purple">
          <div class="lbl">Rata-rata/Order</div>
          <div class="val">${rupiah(data.avgOrderValue)}</div>
        </div>
      </div>
      <div class="updated-note">Periode: <b>${periodTxt}</b></div>

      <div class="card">
        <h2>Status Order</h2>
        <div class="status-grid">
          <div class="status-chip terima"><div class="num">${sc["Terima Order"]||0}</div><div class="lbl">Terima Order</div></div>
          <div class="status-chip terima-lunas"><div class="num">${sc["Terima Order & Lunas"]||0}</div><div class="lbl">Terima &amp; Lunas</div></div>
          <div class="status-chip selesai-lunas"><div class="num">${sc["Selesai & Lunas"]||0}</div><div class="lbl">Selesai &amp; Lunas</div></div>
          <div class="status-chip diambil"><div class="num">${sc["Diambil"]||0}</div><div class="lbl">Diambil</div></div>
        </div>
      </div>

      <div class="card">
        <h2>Tren Omzet${(data.dailyRevenue||[]).length>60?" (per Minggu)":""}</h2>
        ${buildChart(data.dailyRevenue||[])}
      </div>

      <div class="card">
        <h2>Top 10 Pelanggan</h2>
        ${topCustomers.length===0 ? '<p style="color:var(--muted); font-size:13px; margin:0;">Belum ada data pelanggan di periode ini.</p>' :
          topCustomers.map((c,i)=>`
            <div class="cust-row">
              <div class="cust-rank ${rankClass(i)}">${i+1}</div>
              <div class="cust-info">
                <div class="cust-name">${escapeHtml(c.nama||"-")}</div>
                <div class="cust-meta">${escapeHtml(c.hp||"-")} &middot; ${c.orderCount} order</div>
              </div>
              <div class="cust-spend">${rupiahShort(c.totalSpend)}</div>
            </div>
          `).join("")
        }
      </div>
    `;
  }

  /* ---------------- Load data ---------------- */
  async function loadSummary(){
    const url = localStorage.getItem(LS_SCRIPT_URL);
    if(!url){ renderSetupPrompt(); return; }
    renderLoading();
    try{
      const sep = url.includes("?")?"&":"?";
      const res = await fetch(url+sep+"action=summary&from="+currentFrom+"&to="+currentTo);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const data = await res.json();
      renderDashboard(data);
    }catch(err){
      renderError("Cek koneksi internet atau URL Apps Script di Pengaturan.");
    }
  }

  document.getElementById("btn-back").addEventListener("click", ()=>{
    const base = location.href.replace(/\/[^/]*$/, "/");
    window.location.href = base + "index.html";
  });
  document.getElementById("btn-refresh").addEventListener("click", loadSummary);

  // Set default periode ke hari ini
  updatePeriodLabel(currentFrom, currentTo);
  loadSummary();
})();
</script>
</body>

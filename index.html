<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Putra Yusuf Laundry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <h1>🧺 Putra Yusuf Laundry</h1>
            <span id="dateDisplay"></span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Dashboard -->
        <section id="dashboardSection">
            <div class="dashboard-stats">
                <div class="stat-card">
                    <span class="stat-label">📋 Total Order</span>
                    <span class="stat-value" id="totalOrders">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">💰 Pendapatan</span>
                    <span class="stat-value" id="totalRevenue">Rp 0</span>
                </div>
                <div class="stat-card status-masuk">
                    <span class="stat-label">📥 Masuk</span>
                    <span class="stat-value" id="statusMasuk">0</span>
                </div>
                <div class="stat-card status-selesai">
                    <span class="stat-label">✅ Selesai</span>
                    <span class="stat-value" id="statusSelesai">0</span>
                </div>
                <div class="stat-card status-diambil">
                    <span class="stat-label">📦 Diambil</span>
                    <span class="stat-value" id="statusDiambil">0</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="showForm()">➕ Order Baru</button>
                <button class="btn btn-success" onclick="pushData()">📤 Push</button>
                <button class="btn btn-info" onclick="pullData()">📥 Pull</button>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cari nama, no order, atau no HP..." oninput="filterOrders()">
            </div>

            <!-- Order List -->
            <div id="orderList" class="order-list"></div>
        </section>

        <!-- Form Section -->
        <section id="formSection" style="display:none;">
            <div class="form-header">
                <h2>📝 Input Order</h2>
                <button class="btn-close" onclick="hideForm()">✕</button>
            </div>

            <form id="orderForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>Nomor Order</label>
                    <input type="text" id="orderId" readonly>
                </div>

                <div class="form-group">
                    <label>Tanggal Masuk *</label>
                    <input type="date" id="tanggalMasuk" required>
                </div>

                <div class="form-group">
                    <label>Nama Customer *</label>
                    <input type="text" id="namaCustomer" placeholder="Masukkan nama customer" required>
                </div>

                <div class="form-group">
                    <label>Nomor HP *</label>
                    <input type="tel" id="noHp" placeholder="Masukkan nomor HP" required>
                </div>

                <div class="form-group">
                    <label>Jenis Laundry *</label>
                    <select id="jenisLaundry" onchange="updatePaketOptions()" required>
                        <option value="">Pilih Jenis Laundry</option>
                        <option value="kiloan">Kiloan</option>
                        <option value="satuan">Satuan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Paket *</label>
                    <select id="paket" onchange="calculateTotal()" required>
                        <option value="">Pilih Paket</option>
                    </select>
                </div>

                <div class="form-group" id="detailGroup" style="display:none;">
                    <label>Detail Item</label>
                    <select id="detailItem" onchange="calculateTotal()">
                        <option value="">Pilih Detail</option>
                    </select>
                </div>

                <div class="form-group" id="qtyGroup">
                    <label id="qtyLabel">Berat (Kg) *</label>
                    <input type="number" id="qty" placeholder="0" min="0" step="0.1" oninput="calculateTotal()" required>
                </div>

                <div class="form-group">
                    <label>Total Harga</label>
                    <input type="text" id="totalHarga" readonly value="Rp 0">
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Masuk">Masuk</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Diambil">Diambil</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Catatan (Opsional)</label>
                    <textarea id="catatan" placeholder="Tambahkan catatan jika perlu" rows="2"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="hideForm()">Batal</button>
                    <button type="submit" class="btn btn-primary">💾 Simpan Order</button>
                </div>
            </form>
        </section>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
